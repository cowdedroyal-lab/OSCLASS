# 这个项目的证据化清单：每项内容都指向仓库里的证据。校验：profile-atlas check .
schema: portfolio/project@1
id: osclass
title: 操作系统课程笔记与练习
title_en: Operating Systems course notebook
kind: course
role: solo
status: done
period: {start: "2023-09", end: "2023-09"}
visibility: hidden

summary: 跟 B 站操作系统课做的进程、线程、互斥锁和信号量 C 语言练习
problem: >-
  理解操作系统里的并发基础：进程创建、线程创建与回收、共享数据竞争，
  以及用互斥锁和信号量解决经典同步问题。

techs:
  - slug: posix-threads
    depth: used
    proposed: {name: POSIX Threads, name_zh: POSIX 线程, kind: system}
  - slug: mutex
    depth: used
    proposed: {name: Mutex, name_zh: 互斥锁, kind: concept}
  - slug: semaphore
    depth: used
    proposed: {name: Semaphore, name_zh: 信号量, kind: concept}
  - slug: process-fork
    depth: used
    proposed: {name: Process Creation with fork, name_zh: fork 进程创建, kind: concept}
  - slug: classic-synchronization-problems
    depth: used
    proposed: {name: Classic Synchronization Problems, name_zh: 经典同步问题, kind: concept}

contributions:
  - what: 用 fork 创建子进程，打印父子 pid 并观察孤儿进程
    why: 理解进程创建和父子关系
    techs: [process-fork]
    evidence: [fork-code]
  - what: 用 pthread 多线程做蒙特卡洛估算圆周率，并写了单线程版本作对照
    why: 练习线程创建与回收
    techs: [posix-threads]
    evidence: [pi-threads, pi-single]
  - what: 分别用互斥锁和信号量保护售票共享变量
    why: 两个线程同时读改写剩余票数会产生竞争
    techs: [mutex, semaphore]
    evidence: [mutex-code, sem-code]
  - what: 用信号量实现生产者消费者、读者写者、理发师、哲学家就餐问题
    why: 练习经典同步问题的 P/V 写法
    techs: [semaphore, mutex, classic-synchronization-problems]
    evidence: [pc-code, rw-code, barber-code, philosopher-code]
  - what: 用初值为 2 的信号量限制 5 辆车同时通过岔路口的数量
    techs: [semaphore]
    evidence: [road-sem]
  - what: 写 hellothread、multithreads 演示线程创建，以及两个线程无保护地递增同一全局变量
    techs: [posix-threads]
    evidence: [hello-thread, shared-counter]
  - what: 用 check 单元测试库写了最小测试例（add(2,3) == 5）
    evidence: [check-test]

findings:
  - claim: 哲学家就餐里每人先拿左叉再拿右叉的朴素写法会产生死锁
    kind: pitfall
    evidence: [philosopher-code]

questions:
  - 哲学家就餐的死锁是否做过实际复现或解决？仓库里只有会死锁的版本

